version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: java_web_postgres
    restart: always
    environment:
      POSTGRES_DB: java_web_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: